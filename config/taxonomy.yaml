# Caucus Pulse topic taxonomy — two levels, multi-label.
#
# This file IS the intelligence layer: edit it in place and the nightly
# classifier picks it up on its next run. A tweet can carry several
# (macro, subtopic) assignments; a subtopic assignment always counts toward
# its macro too, so "56 tweets about Dilley" rolls up into Immigration
# without double-reading in reports (subtopics render nested under macros).
#
# Grow it from the daily report's "emerging clusters" section: the classifier
# surfaces tweets that fit nothing, with a suggested subtopic label — add the
# ones you approve here. It never silently invents categories.
#
# Fields per subtopic: label (required), aliases (optional hints for the
# classifier — nicknames, hashtags, misspellings it should recognize).

immigration:
  label: Immigration
  subtopics:
    dilley-detention:
      label: Dilley detention facility
      aliases: ["Dilley", "South Texas Family Residential Center", "NJ detention"]
    ice-enforcement:
      label: ICE enforcement / raids
      aliases: ["ICE raids", "deportation raids"]
    border-policy:
      label: Border policy
    dreamers-daca:
      label: Dreamers / DACA
    asylum-refugees:
      label: Asylum & refugees

