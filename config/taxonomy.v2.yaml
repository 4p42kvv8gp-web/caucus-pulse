# Caucus Pulse topic taxonomy — two levels, multi-label. v2, revised
# 2026-09-10 from three weeks of classified data (2026-08-20..09-09); the
# reasoning and the v1 → v2 key mapping are in docs/TAXONOMY_V2.md.
#
# This file IS the intelligence layer: edit it in place and the nightly
# classifier picks it up on its next run. A tweet can carry several
# (macro, subtopic) assignments; a subtopic assignment always counts toward
# its macro too, so "56 tweets about Dilley" rolls up into Immigration
# without double-reading in reports (subtopics render nested under macros).
#
# Grow it from the daily report's "emerging clusters" section: the classifier
# surfaces tweets that fit nothing, with a suggested subtopic label — add the
# ones you approve here. It never silently invents categories. The nightly
# `stories --auto-promote` also writes candidates that clear settings.stories
# into this file as provisional developing stories; prune them, do not
# approve them one by one.
#
# THE STORY IS THE UNIT (owner, 2026-09-10). Macros are shelves for
# navigation only; "Congress & campaign politics" means nothing on its own.
# The rows that matter are specific, named, dated developing stories:
# "Technology → Jacob Coxon resignation", "Immigration → Liam Ramos /
# Dilley". Every macro carries the stories the archive supports; a post
# about a named event is assigned the story, never left at the bare macro.
# Generic subtopics survive only where a durable subject has real volume and
# no story. Catch-all rows ("campaign politics", "political rhetoric",
# "party and caucus activity") are forbidden: name the fight, the vote, the
# bill or the event, or drop the row.
#
# Fields per subtopic:
#   label         required; what the dashboard and the classifier see.
#   aliases       optional hints for the classifier — nicknames, hashtags,
#                 misspellings the label itself cannot carry. Keep them few:
#                 every line here is rendered into the classifier prompt.
#   story: true   a developing story: a named event, person, place, bill or
#                 vote the caucus is reacting to. It sits beside the generic
#                 sibling it belongs to and wins over it when both fit.
#   since         "YYYY-MM-DD": the first day the archive shows caucus posts
#                 about the story, or the story's real start when it predates
#                 the archive (noted in docs/TAXONOMY_V2.md). Always quote
#                 it — an unquoted date loads as a JS Date.
#   provisional: true
#                 the row may be pruned without asking. The nightly --retire
#                 marks it retired after settings.stories.retire_after_quiet_days
#                 with no assignments. Auto-promoted stories carry it, and so
#                 does every date-bound message event here (a tribute, an
#                 anniversary wave, a single vote) so it leaves the prompt on
#                 its own once the caucus moves on. Delete the flag to keep a
#                 story until you say otherwise.
#   promoted      "YYYY-MM-DD": the day a provisional row entered this file;
#                 the retirement clock starts here, not at `since`.
#   retired: true out of the classifier prompt, key kept so rollups, history
#                 and config/corrections.yaml still resolve. Used for quiet
#                 stories and for the v1 rows this revision replaced.
#   anchors       tweet ids a story is built around; a post that quotes,
#                 replies to or retweets one is assigned the story before the
#                 model runs (docs/QUOTED_CONTEXT.md). Ids never reach the
#                 prompt.
#
# Routing rules the rows are built around (mirror them in the prompt):
# - A named event with a story row goes to that story wherever the row sits
#   (a Labor Day post → labor/labor-day-2026, a Steinem tribute →
#   commemorations/gloria-steinem). commemorations/holidays-observances and
#   /tributes are only for observances and obituaries with no story row.
# - District emergencies (fire, flood, storm, recovery money) → disasters,
#   never climate; a disaster alone is not climate policy.
# - Fairs, parades, visits, congratulations → constituent-services, not
#   congress-politics. Campaign-trail posts with no named fight get the bare
#   macro or [] — there is deliberately no "campaign" row.
# - oversight rows are additive: an ICE facility visit is
#   immigration/detention AND oversight/facility-visits.
# - Spanish-language posts are classified exactly like English ones.
#
# Formatting the pipeline depends on: macro keys at column 0, one blank line
# between macros and none inside a macro block, `  subtopics:` on every macro
# (`{}` when empty), subtopic keys at 4 spaces and their fields at 6 —
# stories.js inserts and retires entries by those exact indents.

