<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caucus-pulse</title>
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty;font-variant-numeric:tabular-nums}
  a{color:#1d1d1f;text-decoration:none;text-underline-offset:2px}a:hover{text-decoration:underline}
  th,td{vertical-align:middle}button{font:inherit;color:inherit}
  select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #1d1d1f;outline-offset:2px}
  .rowhover{cursor:pointer;transition:background .12s ease}.rowhover:hover{background:#f7f7f9}
  .quiet{font-size:12px;font-weight:500;color:#6e6e73;white-space:nowrap}.quiet:hover{color:#1d1d1f;text-decoration:none}
  .pill{font-size:12px;font-weight:600;color:#fff;background:#1d1d1f;border:0;padding:6px 14px;border-radius:980px;white-space:nowrap;cursor:pointer}.pill:hover{background:#3a3a3c}
  .textbtn{background:transparent;border:0;padding:0;font-size:12px;font-weight:500;cursor:pointer}.textbtn:hover{text-decoration:underline}
  header a.nav{color:#6e6e73}header a.nav.on{color:#1d1d1f;font-weight:600}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:10;height:50px;display:flex;align-items:center;gap:28px;padding:0 max(20px,calc((100% - 1240px)/2 + 20px));background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)">
  <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;flex:none">caucus-pulse</div>
  <nav style="display:flex;gap:clamp(12px,2vw,24px);font-size:13px;margin:0 auto;flex:1 1 auto;min-width:0;justify-content:center;white-space:nowrap;overflow:hidden"><a class="nav on" href="./index.html">Dashboard</a><a class="nav" href="./incidents.html">Incidents</a></nav>
  <div style="display:flex;align-items:center;gap:12px;flex:none;white-space:nowrap"><span id="updated" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#6e6e73"></span><a class="quiet" href="../reports/latest.md">Daily report</a><button class="pill" data-act="openClip">Compose</button></div>
</header>
<div id="modal"></div>
<main style="width:100%;max-width:1240px;margin:0 auto;padding:22px 20px 48px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
  <section id="controls" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 2px"></section>
  <section id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px"></section>
  <section style="display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
    <div id="topics" style="background:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;flex:2 1 560px;min-width:0"></div>
    <div style="flex:1 1 300px;min-width:0;position:relative;min-height:340px">
      <div id="feed" style="position:absolute;inset:0;background:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:9px;min-width:0;box-sizing:border-box"></div>
    </div>
  </section>
  <section style="display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
    <div id="phrases" style="background:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;flex:2 1 560px;min-width:0"></div>
    <div id="clusters" style="background:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 300px"></div>
  </section>
  <section id="district" style="background:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px"></section>
</main>
</div>
<script type="module">
import { C, CT, KEYS, SHORT, esc, fmt, arrow, etTime, etDay, etWhen, headerDate, dot, fill, seg, spark, chevron, control, select, avatar, tag, copyText, loadRollups } from './ui.js';

let D = null;
const state = {
  caucus: 'All', window: 't', open: {}, topic: 'all', sort: 'Newest',
  clipOpen: false, clipSubject: '', clipCaucus: 'All', clipWindow: 't', clipSort: 'Engagement', clipFormat: 'List', copied: false,
  inc: { handle: true, district: true, caucus: true, counts: true, quote: true, time: false, numbered: true, footer: true }
};
let copyTimer = null;

const $ = (id) => document.getElementById(id);
const label = (k) => D.labels[k] || String(k).split('/').pop().split(/[_-]+/).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
const byKey = (k) => D.topics.find((t) => t.key === k);
const val = (t, win = state.window, scope = state.caucus) => t[win][scope] || { n: 0, eng: 0, m: 0 };
const caucusName = (k) => k === 'All' ? 'all caucuses' : (D.caucusNames[k] || k);
const inTopic = (f, key) => f.topics.some((tk) => tk === key || tk.startsWith(key + '/'));
const winPosts = (f) => state.window === 't' ? f.date === D.today : true;

function render() {
  const scope = state.caucus, win = state.window, isAll = scope === 'All';
  const S = (D.stats[scope] || D.stats.All)[win];
  const curve = (D.stats[scope] || D.stats.All).curve48;

  $('updated').innerHTML = `${dot('#1d1d1f', 6)}${esc(headerDate(D.today))} · updated ${D.lastPollAt ? esc(etTime(D.lastPollAt)) : '—'}`;
  $('updated').title = D.lastPollAt ? `Next poll ~${etTime(new Date(new Date(D.lastPollAt).getTime() + 20 * 60000).toISOString())}` : '';

  $('controls').innerHTML =
    control([['All', 'All', null], ['CPC', 'CPC', C.CPC], ['NewDem', 'New Dem', C.NewDem], ['CBC', 'CBC', C.CBC]], 'caucus', scope) +
    control([['t', 'Today', null], ['w', '7 days', null]], 'window', win);

  // ── stat cards ──
  const coreRaw = D.core.map(({ name, topics }) => ({ name, n: topics.reduce((a, k) => a + (byKey(k) ? val(byKey(k)).n : 0), 0) }));
  const coreMax = Math.max(1, ...coreRaw.map((c) => c.n));
  const coreN = coreRaw.reduce((a, c) => a + c.n, 0);
  const classified = D.topics.reduce((a, t) => a + val(t).n, 0);
  const leader = D.topics.filter((t) => val(t).n > 0).sort((a, b) => b.momentum.score - a.momentum.score)[0];
  const card = (inner) => `<div style="background:#fff;border-radius:14px;padding:16px 18px 15px;display:flex;flex-direction:column;gap:6px;justify-content:space-between">${inner}</div>`;
  $('cards').innerHTML = [
    card(`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6e6e73"><span>Posts</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div style="font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1">${fmt(S.posts)}</div>${spark(curve, 108, 26)}</div>
      <div style="display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px">${seg([[S.mix[0], '#1d1d1f'], [S.mix[1], '#8e8e93'], [S.mix[2], '#d2d2d7']])}</div>
      <div style="font-size:11px;color:#6e6e73">${S.mix[0]}% original · ${S.mix[1]}% replies · ${S.mix[2]}% reposts</div>`),
    card(`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6e6e73"><span style="white-space:nowrap">Core messages</span><span style="white-space:nowrap">${classified ? Math.round(100 * coreN / classified) : 0}% of posts</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div style="font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1">${fmt(coreN)}</div></div>
      <div style="display:flex;flex-direction:column;gap:3px;margin-top:1px">${coreRaw.map((c) => `<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:0 7px;align-items:center;font-size:12px">${dot('#1d1d1f', 5)}<span>${esc(c.name)}</span><div style="width:44px;height:3px;background:#f0f0f2;border-radius:2px;overflow:hidden">${fill(100 * c.n / coreMax, '#1d1d1f')}</div><span style="font-weight:600;min-width:3.2ch;text-align:right">${fmt(c.n)}</span></div>`).join('')}</div>`),
    card(`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6e6e73"><span>Engagement</span></div>
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1">${fmt(S.eng)}</div>
      <div style="display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px">${seg([[S.top10Share, '#1d1d1f'], [100 - S.top10Share, '#d2d2d7']])}</div>
      <div style="font-size:11px;color:#6e6e73">${fmt(S.perPost)} per post · ${win === 't' ? arrow(S.engDelta) + ' vs 7-day avg · ' : ''}top 10 members ${S.top10Share}%</div>`),
    leader ? card(`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6e6e73"><span style="white-space:nowrap">Momentum leader</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div style="display:flex;align-items:baseline;gap:8px;min-width:0"><span style="font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1">${leader.momentum.score}</span><span style="font-size:15px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;text-wrap:balance">${esc(leader.name)}</span></div>${spark(leader.trend)}</div>
      <div style="display:flex;height:4px;border-radius:2px;overflow:hidden;background:#f0f0f2">${fill(leader.momentum.score, '#1d1d1f')}</div>
      <div style="font-size:11px;color:#6e6e73">driven by <span style="color:#1d1d1f;font-weight:600">${leader.momentum.drivers.map(esc).join(' and ')}</span> · ${arrow(leader.d)} vs 7-day avg</div>`) : ''
  ].join('');

  renderTopics(isAll, scope, win);
  renderFeed(scope, win);
  renderPhrases();
  renderClusters(scope, win);
  renderDistrict();
  renderModal();
}

function renderTopics(isAll, scope, win) {
  const th = (txt, extra = '') => `<th style="font-size:11px;font-weight:500;color:#6e6e73;padding:0 8px 8px;border-bottom:1px solid #e8e8ed;${extra}">${txt}</th>`;
  const colMax = KEYS.map((k) => Math.max(1, ...D.topics.map((t) => t[win][k].n)));
  const top3 = KEYS.map((k) => D.topics.slice().sort((a, b) => b[win][k].n - a[win][k].n).slice(0, 3).map((t) => t.key));
  const maxPosts = Math.max(1, ...D.topics.map((t) => val(t).n));
  const sorted = D.topics.slice().sort((a, b) => val(b).n - val(a).n);
  if (!Object.keys(state.open).length) {
    const first = sorted.find((t) => t.subs.length);
    if (first) state.open[first.key] = true;
  }
  const rankBadge = (i, rank) => `<span title="Top ${rank} topic for ${SHORT[KEYS[i]]}" style="width:15px;height:15px;border-radius:50%;background:${C[KEYS[i]]};color:${KEYS[i] === 'NewDem' ? '#1d1d1f' : '#fff'};font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">${rank}</span>`;

  const rows = sorted.map((t) => {
    const v = val(t);
    const isOpen = t.subs.length > 0 && !!state.open[t.key];
    const mo = t.momentum;
    const caucusCells = isAll ? KEYS.map((k, i) => {
      const n = t[win][k].n;
      const rank = top3[i].indexOf(t.key);
      return `<td style="padding:8px 8px;border-bottom:1px solid #f0f0f2;text-align:right"><div style="display:flex;justify-content:flex-end;align-items:center;gap:5px">${rank >= 0 ? rankBadge(i, rank + 1) : ''}<span>${fmt(n)}</span></div><div style="height:3px;background:#f0f0f2;border-radius:2px;margin-top:3px;overflow:hidden">${fill(100 * n / colMax[i], C[k])}</div></td>`;
    }).join('') : '';
    const momentumTitle = `Momentum ${mo.score} · volume ${Math.round(100 * mo.volume)} · acceleration ${Math.round(100 * mo.accel)} · adoption ${Math.round(100 * mo.adoption)} · spread ${mo.eff} caucuses · engagement ${Math.round(100 * mo.engLift)}`;
    const subRows = isOpen ? t.subs.map((s) => {
      const sv = s[win][scope] || { n: 0, eng: 0, m: 0 };
      const share = v.n ? Math.round(100 * sv.n / v.n) : 0;
      const subCells = isAll ? KEYS.map((k) => `<td style="padding:6px 8px;border-bottom:1px solid #fff;text-align:right;font-size:12px;color:#3a3a3c">${fmt(s[win][k].n)}</td>`).join('') : '';
      return `<tr style="background:#f7f7f9"><td style="padding:6px 8px 6px 22px;border-bottom:1px solid #fff"><span style="font-size:12px">${esc(label(`${t.key}/${s.key}`))}</span><span style="font-size:11px;color:#6e6e73;margin-left:7px">${share}%${s.lead ? ` · lead <span style="font-weight:500">${esc(s.lead)}</span>` : ''}</span></td>${subCells}<td style="padding:6px 8px;border-bottom:1px solid #fff;text-align:right;font-size:12px">${fmt(sv.n)}</td><td style="padding:6px 8px 6px 12px;border-bottom:1px solid #fff"></td><td style="padding:6px 8px;border-bottom:1px solid #fff"></td><td style="padding:6px 8px;border-bottom:1px solid #fff;text-align:right;font-size:12px">${fmt(sv.eng)}</td><td style="padding:6px 0 6px 8px;border-bottom:1px solid #fff;text-align:right;font-size:12px">${fmt(sv.m)}</td></tr>`;
    }).join('') : '';
    return `<tr class="rowhover" data-toggle="${esc(t.key)}" aria-expanded="${isOpen}">
      <td style="padding:8px 8px 8px 0;border-bottom:1px solid #f0f0f2"><div style="display:flex;align-items:center;gap:6px">${chevron(t.subs.length > 0, isOpen)}<span style="font-weight:600;letter-spacing:-0.01em">${esc(t.name)}</span></div></td>
      ${caucusCells}
      <td style="padding:8px 8px;border-bottom:1px solid #f0f0f2;text-align:right;font-weight:600">${fmt(v.n)}${!isAll ? `<div style="height:3px;background:#f0f0f2;border-radius:2px;margin-top:3px;overflow:hidden">${fill(100 * v.n / maxPosts, C[scope])}</div>` : ''}</td>
      <td style="padding:8px 8px 8px 12px;border-bottom:1px solid #f0f0f2"><div style="display:flex;align-items:center;gap:8px">${spark(t.trend)}<span style="font-size:11px;color:${t.d >= 0 ? '#1d1d1f' : '#8e8e93'};font-weight:${t.d >= 0 ? 500 : 400};white-space:nowrap">${arrow(t.d)}</span></div></td>
      <td style="padding:8px 8px;border-bottom:1px solid #f0f0f2;text-align:right" title="${esc(momentumTitle)}"><span style="font-weight:600">${mo.score}</span><div style="height:3px;background:#f0f0f2;border-radius:2px;margin-top:3px;overflow:hidden">${fill(mo.score, mo.score >= 60 ? '#1d1d1f' : '#8e8e93')}</div></td>
      <td style="padding:8px 8px;border-bottom:1px solid #f0f0f2;text-align:right">${fmt(v.eng)}</td>
      <td style="padding:8px 0 8px 8px;border-bottom:1px solid #f0f0f2;text-align:right">${fmt(v.m)}</td></tr>${subRows}`;
  }).join('');

  $('topics').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Topics</h2></div>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>
    <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 8px 8px 0;border-bottom:1px solid #e8e8ed">Topic</th>
    ${isAll ? KEYS.map((k) => `<th style="text-align:right;font-size:11px;font-weight:600;color:${CT[k]};padding:0 8px 8px;border-bottom:1px solid #e8e8ed;width:9%">${SHORT[k]}</th>`).join('') : ''}
    ${th('Posts', 'text-align:right')}
    <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 8px 8px 12px;border-bottom:1px solid #e8e8ed;width:13%">7-day trend</th>
    <th style="text-align:right;font-size:11px;font-weight:500;color:#6e6e73;padding:0 8px 8px;border-bottom:1px solid #e8e8ed;width:9%" title="0–100, 50 = steady. 40% volume lift · 20% acceleration · 20% member adoption · 10% caucus spread · 10% engagement lift, each against the topic's 7-day baseline">Momentum</th>
    ${th('Engagement', 'text-align:right')}
    <th style="text-align:right;font-size:11px;font-weight:500;color:#6e6e73;padding:0 0 8px 8px;border-bottom:1px solid #e8e8ed">Members</th>
  </tr></thead><tbody>${rows || `<tr><td colspan="9" style="padding:30px 0;text-align:center;color:#6e6e73;font-size:13px">No classified posts yet — the nightly job (or the poll-time tagger) fills this in.</td></tr>`}</tbody></table>`;
}

function renderFeed(scope, win) {
  const byC = (f) => scope === 'All' || f.caucus.includes(scope);
  const base = D.feed.filter((f) => winPosts(f) && byC(f));
  let feed = base.filter((f) => state.topic === 'all' || inTopic(f, state.topic));
  if (state.sort === 'Top') feed = feed.slice().sort((a, b) => b.engN - a.engN);
  const macroKeys = D.topics.map((t) => [t.key, t.name]);
  const topicOpts = [['all', 'All topics', base.length]].concat(macroKeys.map(([k, name]) => [k, name, base.filter((f) => inTopic(f, k)).length]));
  const newCount = feed.filter((f) => f.isNew).length;
  const items = feed.map((f) => {
    const chips = f.topics.filter((tk) => !tk.includes('/')).slice(0, 2).map((tk) => tag(label(tk))).join('');
    const extra = f.topics.filter((tk) => !tk.includes('/')).length > 2 ? tag('+' + (f.topics.filter((tk) => !tk.includes('/')).length - 2)) : '';
    const color = CT[f.caucus.find((c) => CT[c])] || '#8e8e93';
    return `<div style="display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid #f0f0f2">${avatar(f.member || f.handle, color)}
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;min-width:0">${f.isNew ? `<span title="Captured in the latest poll">${dot('#1d1d1f', 6)}</span>` : ''}<span style="font-weight:600;font-size:13px">${esc(f.handle)}</span>${f.caucus.map((c) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#6e6e73">${dot(C[c] || '#c7c7cc')}${SHORT[c] || esc(c)}</span>`).join('')}</div><span style="font-size:11px;color:#6e6e73;white-space:nowrap">${esc(etWhen(f.time, D.today))}</span></div>
      <p style="margin:0;font-size:13px;line-height:1.45">${esc(f.text)}</p>
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="display:flex;gap:4px;flex-wrap:wrap">${chips}${extra}</div><span style="font-size:11px;color:#6e6e73;white-space:nowrap">${f.kind === 'repost' ? '↻ repost' : (f.kind === 'quote' ? '❝ ' : '') + fmt(f.engN)}</span></div>
    </div></div>`;
  }).join('');
  $('feed').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div style="display:flex;align-items:baseline;gap:9px"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Feed</h2><span style="font-size:12px;color:#6e6e73;display:inline-flex;align-items:center;gap:5px">${dot('#1d1d1f', 6)}${feed.length} posts · ${newCount} new</span></div>${control([['Newest', 'Newest', null], ['Top', 'Top', null]], 'sort', state.sort)}</div>
  <div style="display:flex;gap:6px">${select(topicOpts, 'topic', state.topic)}</div>
  <div style="overflow:auto;flex:1;min-height:0;padding-right:6px;scrollbar-gutter:stable">${items || '<div style="padding:40px 0;text-align:center;color:#6e6e73;font-size:13px">No posts match this caucus and topic.</div>'}</div>`;
}

function renderPhrases() {
  const rows = D.phrases.map((p) => {
    const hot = p.spread && p.delta / p.spread >= 0.3;
    const firstStr = p.firstSeen === D.today ? 'today' : etDay(p.firstSeen);
    return `<tr><td style="padding:7px 6px 7px 0;border-bottom:1px solid #f0f0f2"><div style="display:flex;align-items:center;gap:8px"><span style="flex:none;width:6px;height:6px;border-radius:50%;background:${p.emerging ? '#1d1d1f' : '#e8e8ed'}"${p.emerging ? ' title="New this week"' : ''}></span><span style="font-weight:600;letter-spacing:-0.01em">${esc(p.text)}</span></div></td>
    <td style="padding:7px 6px;border-bottom:1px solid #f0f0f2">${p.topic ? tag(p.topic) : ''}</td>
    <td style="padding:7px 6px;border-bottom:1px solid #f0f0f2;font-size:12px"><span style="font-weight:500">${esc(p.first || '')}</span><span style="color:#6e6e73"> · ${esc(firstStr)}</span></td>
    <td style="padding:7px 6px;border-bottom:1px solid #f0f0f2"><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:600;min-width:2ch;text-align:right">${p.spread}</span><div style="flex:1;display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px" title="CPC ${p.cm[0]} · New Dem ${p.cm[1]} · CBC ${p.cm[2]}">${seg(p.cm.map((n, i) => [100 * n / Math.max(1, p.spread), C[KEYS[i]]]))}</div></div></td>
    <td style="padding:7px 0 7px 6px;border-bottom:1px solid #f0f0f2;text-align:right;font-size:12px"><span style="${hot ? 'font-weight:700' : 'color:#6e6e73'}">+${p.delta}</span></td></tr>`;
  }).join('');
  $('phrases').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Phrases</h2></div><span style="font-size:11px;color:#6e6e73;display:inline-flex;align-items:center;gap:5px">${dot('#1d1d1f', 6)}new this week</span></div>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>
  <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 6px 8px 0;border-bottom:1px solid #e8e8ed">Phrase</th>
  <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 6px 8px;border-bottom:1px solid #e8e8ed">Topic</th>
  <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 6px 8px;border-bottom:1px solid #e8e8ed">First use</th>
  <th style="text-align:left;font-size:11px;font-weight:500;color:#6e6e73;padding:0 6px 8px;border-bottom:1px solid #e8e8ed;width:22%">Members</th>
  <th style="text-align:right;font-size:11px;font-weight:500;color:#6e6e73;padding:0 0 8px 6px;border-bottom:1px solid #e8e8ed;white-space:nowrap">New 48h</th>
  </tr></thead><tbody>${rows || '<tr><td colspan="5" style="padding:30px 0;text-align:center;color:#6e6e73;font-size:13px">No phrases over the member-spread threshold yet.</td></tr>'}</tbody></table>`;
}

function renderClusters() {
  const items = D.clusters.map((c) => `<div style="display:flex;flex-direction:column;gap:7px;padding:12px 0;border-top:1px solid #f0f0f2">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-weight:600;font-size:13px;letter-spacing:-0.01em">${esc(c.label)}</span><span style="font-size:11px;color:#6e6e73;white-space:nowrap">since ${esc(etWhen(c.since, D.today))}</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-size:12px;color:#6e6e73;display:flex;gap:12px;flex-wrap:wrap"><span><span style="font-weight:700;color:#1d1d1f;font-size:14px">${c.posts}</span> posts</span><span><span style="font-weight:700;color:#1d1d1f;font-size:14px">${c.members}</span> members</span><span><span style="font-weight:700;color:#1d1d1f;font-size:14px">${fmt(c.eng)}</span> engagement</span></div>${spark(c.shape, 72, 18)}</div>
    <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px" title="members by caucus">${seg(c.cm.map((n, i) => [100 * n / Math.max(1, c.members), C[KEYS[i]]]))}</div>
    <div style="font-size:12px;color:#6e6e73;line-height:1.4">“${esc(c.sample)}”</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${c.phrase ? `<span style="font-size:11px;color:#6e6e73">${c.coherence}% say “${esc(c.phrase)}”</span>` : ''}${tag(c.suggest)}<span style="margin-left:auto;display:flex;gap:10px"><button class="textbtn" data-compose="cluster:${esc(c.label)}">Compose</button><a href="../config/taxonomy.yaml" style="font-size:12px;font-weight:500" title="Approve by adding this subtopic to config/taxonomy.yaml">Add ›</a></span></div>
  </div>`).join('');
  $('clusters').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Emerging</h2><span style="font-size:12px;color:#6e6e73">outside the taxonomy</span></div>${items || '<div style="padding:30px 0;text-align:center;color:#6e6e73;font-size:12px">Nothing outside the taxonomy right now.</div>'}`;
}

function renderDistrict() {
  const active = D.incidents.filter((n) => n.status === 'active');
  const cards = active.map((n) => `<div style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:#f7f7f9">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:10px;font-weight:700;color:#d70015;background:#ffebe9;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em">${esc(n.kind)}</span><span style="font-size:11px;color:#6e6e73;white-space:nowrap">${esc(etWhen(n.since, D.today))} → ${esc(etWhen(n.last, D.today))}</span></div>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><span style="font-weight:600;font-size:14px;letter-spacing:-0.01em">${esc(n.place)}</span><span style="font-size:12px"><span style="font-weight:500">${esc(n.handle)}</span><span style="color:#6e6e73"> · ${esc(n.member)}</span></span></div>
    <p style="margin:0;font-size:13px;line-height:1.4;color:#3a3a3c">“${esc(n.timeline[0]?.text || '')}”</p>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#6e6e73"><span>${n.updates} updates · ${fmt(n.engN)} engagement</span><a href="./incidents.html">Thread ›</a></div>
  </div>`).join('');
  $('district').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Breaking in district</h2><span style="font-size:12px;color:#6e6e73">${active.length} active</span></div><a href="./incidents.html" style="font-size:12px;font-weight:500">Open incident desk ›</a></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px">${cards || '<div style="padding:16px 0;color:#6e6e73;font-size:13px">No active district incidents.</div>'}</div>`;
}

// ── Compose ──
function composeText() {
  const { clipSubject: subj, clipCaucus: cc, clipWindow: cw, clipSort, clipFormat, inc } = state;
  if (!subj) return '';
  const [kind, ...rest] = subj.split(':');
  const key = rest.join(':');
  const inWin = (f) => cw === 't' ? f.date === D.today : true;
  const trim = (t, n = 110) => t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t;
  const people = new Map();
  const add = (handle, post, extra) => {
    const m = D.members[handle];
    if (!m) return;
    const p = people.get(handle) || { handle, name: m[0], district: m[1], caucus: m[2], posts: 0, eng: 0, quote: '', quoteEng: -1, last: '' };
    p.posts += 1;
    if (post) {
      p.eng += post.engN || 0;
      if ((post.engN || 0) > p.quoteEng && post.text) { p.quoteEng = post.engN || 0; p.quote = post.text; }
      p.last = post.time ? etWhen(post.time, D.today) : p.last;
    }
    Object.assign(p, extra || {});
    people.set(handle, p);
  };
  let title = '';
  if (kind === 'topic') {
    const t = byKey(key); title = t ? t.name : key;
    D.feed.filter((f) => inWin(f) && inTopic(f, key) && f.kind !== 'repost').forEach((f) => add(f.handle, f));
    (t?.subs || []).forEach((s) => { if (s.lead && people.has(s.lead)) Object.assign(people.get(s.lead), { leadOf: label(`${key}/${s.key}`) }); });
  } else if (kind === 'phrase') {
    const ph = D.phrases.find((x) => x.text === key); title = `“${key}”`;
    if (ph?.first) add(ph.first, null, { firstUse: ph.firstSeen === D.today ? 'today' : etDay(ph.firstSeen) });
    D.feed.filter((f) => inWin(f) && f.kind !== 'repost' && f.text.toLowerCase().includes(key.toLowerCase())).forEach((f) => add(f.handle, f));
  } else if (kind === 'cluster') {
    const cl = D.clusters.find((x) => x.label === key); title = key + ' (emerging)';
    (cl?.who || []).forEach((h, i) => add(h, i === 0 && cl.sample ? { engN: 0, text: cl.sample } : null));
  } else if (kind === 'incident') {
    const n = D.incidents.find((x) => x.id === key); title = n ? n.title : key;
    (n?.timeline || []).forEach((e) => add(e.who, { engN: e.engN, text: e.text, time: e.time }));
    (n?.others || []).forEach((h) => { if (people.has(h)) people.get(h).via = 'amplified'; });
  }
  let rows = [...people.values()].filter((p) => cc === 'All' || p.caucus.includes(cc));
  rows.sort((a, b) => clipSort === 'Engagement' ? b.eng - a.eng : clipSort === 'Caucus' ? (a.caucus[0] || 'zz').localeCompare(b.caucus[0] || 'zz') || b.eng - a.eng : a.name.split(' ').pop().localeCompare(b.name.split(' ').pop()));
  const scopeStr = caucusName(cc) + ' · ' + (cw === 't' ? 'today' : 'last 7 days');
  const totalPosts = rows.reduce((a, p) => a + p.posts, 0);
  const head = `${rows.length} ${rows.length === 1 ? 'official' : 'officials'} on ${title} · ${scopeStr}` + (inc.counts ? ` · ${totalPosts} posts` : '');
  const foot = inc.footer ? `\n—\ncaucus-pulse · ${D.lastPollAt ? etTime(D.lastPollAt) : ''} ET · archive` : '';
  if (rows.length === 0) return `${head}\n\nNo one in scope has posted on this yet.${foot}`;
  if (clipFormat === 'Handles') return rows.map((p) => p.handle).join(' ') + foot;
  if (clipFormat === 'Brief') {
    const names = rows.map((p) => p.name.replace(/^(Rep\.|Sen\.|Gov\.|Del\.|Leader) /, '') + (inc.district && p.district ? ` (${p.district})` : ''));
    const list = names.length <= 4 ? names.join(', ') : names.slice(0, 3).join(', ') + ` and ${names.length - 3} others`;
    const top = rows.find((p) => p.quote);
    return `${list} ${rows.length === 1 ? 'has' : 'have'} posted on ${title} (${scopeStr}${inc.counts ? `, ${totalPosts} posts` : ''}).` + (inc.quote && top ? `\n\nStrongest post — ${top.name}${inc.handle ? ' ' + top.handle : ''}: “${trim(top.quote, 160)}”` : '') + foot;
  }
  const lines = rows.map((p, i) => {
    const bits = [p.name];
    const meta = [inc.district && p.district, inc.caucus && p.caucus.map((c) => SHORT[c] || c).join('/')].filter(Boolean).join(' · ');
    if (meta) bits.push(`(${meta})`);
    if (inc.handle) bits.push(p.handle);
    const tail = [inc.counts && (p.posts + (p.posts === 1 ? ' post' : ' posts') + (p.eng ? ` · ${fmt(p.eng)} eng` : '')), inc.time && p.last && `last ${p.last}`, p.leadOf && `leads on ${p.leadOf}`, p.firstUse && `first use ${p.firstUse}`, p.via].filter(Boolean).join(' · ');
    let line = (inc.numbered ? `${i + 1}. ` : '• ') + bits.join(' ') + (tail ? ` — ${tail}` : '');
    if (inc.quote && p.quote) line += `\n   “${trim(p.quote)}”`;
    return line;
  });
  return `${head}\n\n${lines.join('\n')}${foot}`;
}

function renderModal() {
  if (!state.clipOpen) { $('modal').innerHTML = ''; return; }
  const subjects = D.topics.map((t) => [`topic:${t.key}`, `Topic · ${t.name}`])
    .concat(D.phrases.slice(0, 6).map((p) => [`phrase:${p.text}`, `Phrase · ${p.text}`]))
    .concat(D.incidents.map((n) => [`incident:${n.id}`, `Incident · ${n.title}`]))
    .concat(D.clusters.map((c) => [`cluster:${c.label}`, `Emerging · ${c.label}`]));
  if (!state.clipSubject && subjects.length) state.clipSubject = subjects[0][0];
  const text = composeText();
  const entries = text.split('\n').filter((l) => /^(\d+\.|•) /.test(l)).length || (state.clipFormat === 'Handles' ? text.split(' ').filter((w) => w.startsWith('@')).length : 1);
  const check = (k, lab) => `<label style="display:flex;align-items:center;gap:7px"><input type="checkbox" data-tog="${k}"${state.inc[k] ? ' checked' : ''}>${lab}</label>`;
  const plainSel = (list, key, value) => `<select data-sel="${key}" style="font:inherit;font-size:13px;color:#1d1d1f;background:#f5f5f7;border:1px solid #e0e0e4;border-radius:8px;padding:6px 28px 6px 10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6e6e73 50%),linear-gradient(135deg,#6e6e73 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat;width:100%;min-width:0">${list.map(([k, name]) => `<option value="${esc(k)}"${k === value ? ' selected' : ''}>${esc(name)}</option>`).join('')}</select>`;
  const lbl = (t) => `<span style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6e6e73">${t}</span>`;
  $('modal').innerHTML = `<div data-act="closeClip" style="position:fixed;inset:0;z-index:50;background:rgba(29,29,31,.38);display:flex;align-items:center;justify-content:center;padding:20px">
  <div role="dialog" aria-modal="true" aria-label="Compose for Signal" data-stop style="background:#fff;border-radius:16px;width:min(960px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #f0f0f2"><div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.01em">Compose</h2><span style="font-size:12px;color:#6e6e73">plain text for Signal</span></div><button data-act="closeClip" aria-label="Close" style="background:transparent;border:0;font-size:18px;line-height:1;color:#6e6e73;cursor:pointer;padding:2px 6px">×</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:0;min-height:0;overflow:auto">
      <div style="flex:1 1 300px;min-width:0;padding:14px 18px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #f0f0f2">
        <div style="display:flex;flex-direction:column;gap:5px">${lbl('Subject')}${plainSel(subjects, 'clipSubject', state.clipSubject)}</div>
        <div style="display:flex;flex-direction:column;gap:5px">${lbl('Scope')}<div style="display:flex;gap:6px;flex-wrap:wrap">${plainSel([['All', 'All caucuses'], ...KEYS.map((k) => [k, D.caucusNames[k] || k])], 'clipCaucus', state.clipCaucus)}${control([['t', 'Today', null], ['w', '7 days', null]], 'clipWindow', state.clipWindow)}</div></div>
        <div style="display:flex;flex-direction:column;gap:6px">${lbl('Include')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:13px">${check('handle', '@handle')}${check('district', 'District')}${check('caucus', 'Caucus')}${check('counts', 'Posts &amp; engagement')}${check('quote', 'Best quote')}${check('time', 'Time of last post')}${check('numbered', 'Numbered')}${check('footer', 'Source line')}</div></div>
        <div style="display:flex;flex-direction:column;gap:5px">${lbl('Order')}${control([['Engagement', 'Engagement', null], ['Caucus', 'Caucus', null], ['Name', 'Name', null]], 'clipSort', state.clipSort)}</div>
        <div style="display:flex;flex-direction:column;gap:5px">${lbl('Format')}${control([['List', 'List', null], ['Brief', 'Brief', null], ['Handles', 'Handles only', null]], 'clipFormat', state.clipFormat)}</div>
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px 12px;background:#f7f7f9;border-radius:10px;color:#8e8e93"><input type="checkbox" disabled style="margin-top:2px"><span>Also run an X search<br><span style="font-size:11px;color:#6e6e73">not connected yet — will add officials outside the tracked list, marked “via search”</span></span></label>
      </div>
      <div style="flex:1.4 1 380px;min-width:0;padding:14px 18px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12px;color:#6e6e73">${entries} entries · ${text.length} characters</span><div style="display:flex;gap:6px"><button class="pill" data-act="copyClip">${state.copied ? 'Copied ✓' : 'Copy text'}</button></div></div>
        <textarea readonly spellcheck="false" id="cliptext" style="flex:1;min-height:360px;width:100%;box-sizing:border-box;resize:vertical;font:inherit;font-size:13px;line-height:1.45;padding:12px 14px;border:1px solid #e8e8ed;border-radius:10px;background:#f7f7f9;color:#1d1d1f">${esc(text)}</textarea>
      </div>
    </div>
  </div></div>`;
}

// ── events ──
document.addEventListener('click', (e) => {
  const setBtn = e.target.closest('[data-set]');
  if (setBtn) { state[setBtn.dataset.set] = setBtn.dataset.val; state.copied = false; render(); return; }
  const comp = e.target.closest('[data-compose]');
  if (comp) { state.clipOpen = true; state.copied = false; state.clipSubject = comp.dataset.compose; state.clipCaucus = state.caucus; state.clipWindow = state.window; render(); return; }
  const actBtn = e.target.closest('button[data-act]');
  if (actBtn) {
    const a = actBtn.dataset.act;
    if (a === 'openClip') { state.clipOpen = true; state.copied = false; state.clipCaucus = state.caucus; state.clipWindow = state.window; }
    if (a === 'closeClip') state.clipOpen = false;
    if (a === 'copyClip') { copyText(composeText(), () => { state.copied = true; render(); clearTimeout(copyTimer); copyTimer = setTimeout(() => { state.copied = false; render(); }, 1800); }); return; }
    render();
    return;
  }
  // click on the backdrop itself (outside the dialog) closes the modal
  if (e.target.closest('[data-act="closeClip"]') && !e.target.closest('[data-stop]')) { state.clipOpen = false; render(); return; }
  const row = e.target.closest('[data-toggle]');
  if (row) { state.open[row.dataset.toggle] = !state.open[row.dataset.toggle]; render(); }
});
document.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-sel]');
  if (sel) { state[sel.dataset.sel] = sel.value; state.copied = false; render(); return; }
  const tog = e.target.closest('[data-tog]');
  if (tog) { state.inc[tog.dataset.tog] = !state.inc[tog.dataset.tog]; state.copied = false; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.clipOpen) { state.clipOpen = false; render(); } });

loadRollups().then((data) => {
  if (!data) {
    document.querySelector('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:#6e6e73;font-size:14px">No data yet — the first poll and nightly run create <code>site/data/rollups.json</code>.</div>';
    return;
  }
  D = data;
  render();
});
</script>
