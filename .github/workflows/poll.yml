# Capture poller — every 20 minutes. Captures new tweets, live-tags them for
# the dashboard feed (skipped automatically if no Anthropic credential can be
# resolved or CLASSIFY_LIVE=false), regroups incidents, rebuilds site/data/rollups.json.
name: poll
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/scripts/**'
      - '.github/workflows/poll.yml'
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

# One writer at a time, including the news publication job. Queue pending
# writers instead of allowing each new poll to replace the previous waiter.
concurrency:
  group: data-writes
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # Anthropic workload identity federation (see src/anthropic-auth.js)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      # The event SHA can predate a preceding queued writer's data commit.
      # Resolve the selected branch now, after acquiring the writer lock.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local embedding model for the poll's incremental embed + similarity
      # hints (see nightly.yml). Best-effort: capture must never wait on it.
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: data/models
          key: embedding-model-bge-small-en-v1.5-ea104dacec62
      - name: Download embedding model (verified; no-op when cached)
        continue-on-error: true
        timeout-minutes: 1
        run: npm run download-model
      - name: Pull, embed, live-tag, rebuild site data
        id: pipeline
        continue-on-error: true
        timeout-minutes: 12
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_LIST_ID: ${{ vars.X_LIST_ID }}
          # Read budget comes from config/settings.json "daily_read_budget"
          # (git-controlled); the X_DAILY_READ_BUDGET repo variable is no longer read.
          CLASSIFY_LIVE: ${{ vars.CLASSIFY_LIVE }}
        run: .github/scripts/poll.sh
      - name: Commit archive + site data
        id: capture_commit
        if: ${{ !cancelled() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        run: |
          .github/scripts/commit-data.sh "poll: $(date -u +'%Y-%m-%d %H:%M') capture" data site/data
      # Originals are acquired only after capture is safely published. The
      # acquisition runner checkpoints its intent, response and accepted cache
      # before continuing, so a later failure cannot lose captured posts or
      # silently repeat an uncertain lookup. Reclassification waits for the
      # next ordinary poll; this step never starts a second live model pass.
      - name: Acquire missing repost originals
        id: repost_sources
        if: ${{ success() && steps.pipeline.outcome == 'success' && steps.capture_commit.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node --use-env-proxy src/repost-acquire.js
      - name: Rebuild source display after acquisition
        id: repost_display
        if: ${{ !cancelled() && steps.capture_commit.outcome == 'success' && (steps.repost_sources.outcome == 'success' || steps.repost_sources.outcome == 'failure') }}
        timeout-minutes: 2
        run: npm run sitedata
      - name: Commit recovered sources + site data
        if: ${{ !cancelled() && steps.capture_commit.outcome == 'success' && (steps.repost_sources.outcome == 'success' || steps.repost_sources.outcome == 'failure') }}
        run: |
          .github/scripts/commit-data.sh "poll: $(date -u +'%Y-%m-%d %H:%M') repost sources" data site/data
      - name: Report incomplete pipeline after saving its work
        if: ${{ !cancelled() && steps.pipeline.outcome == 'failure' }}
        run: exit 1
      - name: Report incomplete source acquisition after saving its work
        if: ${{ !cancelled() && steps.repost_sources.outcome == 'failure' }}
        run: exit 1
      - name: Retain validated work if publication failed
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: poll-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/caucus-pulse-recovery/validated-data.bundle
            data/repost-acquisition.json
            data/quoted.json
            data/state.json
          if-no-files-found: ignore
          retention-days: 7
