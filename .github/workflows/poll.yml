# Capture poller — every 20 minutes. Captures new tweets, live-tags them for
# the dashboard feed (skipped automatically if no Anthropic credential can be
# resolved or CLASSIFY_LIVE=false), regroups incidents, rebuilds site/data/rollups.json.
name: poll
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

# One writer at a time — poll, nightly, and authors all commit to main.
concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # Anthropic workload identity federation (see src/anthropic-auth.js)

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull, live-tag, rebuild site data
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_LIST_ID: ${{ vars.X_LIST_ID }}
          X_DAILY_READ_BUDGET: ${{ vars.X_DAILY_READ_BUDGET }}
          CLASSIFY_LIVE: ${{ vars.CLASSIFY_LIVE }}
        run: npm run poll
      - name: Commit archive + site data
        run: |
          git config user.name "caucus-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && { echo "no new tweets"; exit 0; }
          git commit -m "poll: $(date -u +'%Y-%m-%d %H:%M') capture"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase
          done
          git push
