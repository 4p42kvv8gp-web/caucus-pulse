# Nightly pipeline — 07:30 UTC (2:30/3:30am ET, after the ET day closes):
# 24h engagement refresh → Claude batch classification → story candidates,
# then continuous promotion/retirement (src/stories.js --auto-promote
# --retire edits config/taxonomy.yaml in place; the classifier only sees
# that change on the NEXT night's run) → taxonomy learning
# (src/taxonomy-learn.js --apply: reads each macro's posts, proposes
# subtopics / elevations / merges / retirements with evidence, applies the
# auto ones to the YAML) → corrections → strategic-syntax
# n-grams → incidents → rollups → daily report → site data. Each stage reads
# the previous stage's committed files, so a failed stage can be re-run with
# workflow_dispatch. Claude auth for every stage is the same federation
# exchange (src/anthropic-auth.js); stories.js goes through anthropicClient
# like classify.js, so no extra secret is involved.
name: nightly
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma-separated stages to run, empty = all: refresh,embed,classify,stories,promote,taxonomy-learn,corrections,syntax,incidents,rollup,report,sitedata'
        required: false
        default: ''
      classify_wait_minutes:
        description: 'How long the classify stage waits on its batch before handing back (default: settings classify.max_wait_minutes, 55). The job holds the data-writes lock while it waits, so polls queue behind it.'
        required: false
        default: ''

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # Anthropic workload identity federation (see src/anthropic-auth.js)

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The local embedding model (35 MB, digests pinned in src/embeddings.js;
      # the cache key is its revision). Without it `npm run embed` prints a
      # one-line skip and the chain continues: the classifier just gets no
      # similarity hints and the dashboard no "similar, unlabeled" lists.
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: data/models
          key: embedding-model-bge-small-en-v1.5-ea104dacec62
      - name: Download embedding model (verified; no-op when cached)
        continue-on-error: true
        run: npm run download-model
      - name: Refresh, embed, classify, mine syntax, roll up, report
        # Claude auth: the job's OIDC token is exchanged for a short-lived
        # Anthropic access token in-process; no ANTHROPIC_API_KEY secret.
        # Runs stage by stage (nightly.sh) rather than as one && chain, so a
        # stage that needs Claude cannot take down the ones that do not. The
        # script still exits non-zero if any stage failed.
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NIGHTLY_STAGES: ${{ inputs.stages }}
          CLASSIFY_MAX_WAIT_MINUTES: ${{ inputs.classify_wait_minutes }}
        run: .github/scripts/nightly.sh
      - name: Commit results
        # always(): whatever stages did finish are worth keeping even when a
        # later one failed. config/taxonomy.yaml is in the list because
        # --auto-promote/--retire write it; without it the night's promotions
        # would die with the runner.
        if: always()
        env:
          NIGHTLY_STAGES: ${{ inputs.stages }}
        run: |
          .github/scripts/commit-data.sh "nightly: $(date -u +'%Y-%m-%d') ${NIGHTLY_STAGES:+stages }${NIGHTLY_STAGES:-refresh + classify + stories + report}" data reports site/data config/taxonomy.yaml
      # Last, and after the commit so the night's work is saved either way:
      # turn the run red if the pipeline only *looked* like it worked. Every
      # Claude stage swallows its own errors to keep the rest of the night
      # running, which on 2026-09-10 let a night with no Anthropic credit
      # report success. This step reads what actually landed on disk.
      - name: Health check
        if: always()
        # Same environment as the pipeline it is judging: without the token
        # the credentials check reports X as unresolvable and fails the run
        # on nothing. (Anthropic needs no env here — federation reads the
        # OIDC variables the job already carries.)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run health
