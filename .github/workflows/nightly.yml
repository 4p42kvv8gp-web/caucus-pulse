# Nightly pipeline — 07:30 UTC (2:30/3:30am ET, after the ET day closes):
# 24h engagement refresh → Claude batch classification → strategic-syntax
# n-grams → rollups → daily report. Each stage reads the previous stage's
# committed files, so a failed stage can be re-run with workflow_dispatch.
name: nightly
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # Anthropic workload identity federation (see src/anthropic-auth.js)

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh, classify, mine syntax, roll up, report
        # Claude auth: the job's OIDC token is exchanged for a short-lived
        # Anthropic access token in-process; no ANTHROPIC_API_KEY secret.
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_DAILY_READ_BUDGET: ${{ vars.X_DAILY_READ_BUDGET }}
        run: npm run nightly
      - name: Commit results
        run: |
          .github/scripts/commit-data.sh "nightly: $(date -u +'%Y-%m-%d') refresh + classify + report" data reports site/data
