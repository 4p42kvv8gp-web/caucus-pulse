# Weekly author-table refresh (user objects bill $0.01 each — hence weekly,
# not per poll). Also run it manually after editing config/accounts.csv.
name: authors
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Refresh author table
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_LIST_ID: ${{ vars.X_LIST_ID }}
        run: npm run authors
      - name: Commit author table
        run: |
          .github/scripts/commit-data.sh "authors: weekly refresh" data/authors.json data/state.json
