# A bounded experiment, not a recurring scheduler or a production service.
# The first sample stopped before dispatch; this revision records closed error
# codes in the job log as well as the journal for independent diagnosis.
name: capture-reliability-pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-reliability-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Never occupy the collection/publication lock while waiting between checks.
concurrency:
  group: capture-reliability-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Measure capture dispatch and committed completion for up to 50 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --use-env-proxy .github/scripts/capture-reliability-pilot.mjs
      - name: Preserve dispatch intents and observed outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/caucus-capture-pilot/
          if-no-files-found: warn
          retention-days: 14
