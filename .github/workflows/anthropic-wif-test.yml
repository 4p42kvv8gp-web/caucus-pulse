name: anthropic-wif-test
# Manual smoke test for Anthropic workload identity federation.
# Rule: caucus-pulse-actions (fdrl_011gEXn9XGBiTzgxQBmf6Vay) -> service account caucus-pulse-classifier.
# GitHub's sub claim carries numeric IDs: repo:4p42kvv8gp-web@283529528/caucus-pulse@1353150721:ref:refs/heads/main
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Show OIDC claims (payload only)
        run: |
          echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' | base64 -d | jq '{iss, sub, aud, repository, repository_owner, repository_owner_id, ref, event_name, workflow_ref}'
      - name: Exchange for an Anthropic access token
        shell: bash
        run: |
          set -o pipefail
          curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_011gEXn9XGBiTzgxQBmf6Vay",
            "organization_id": "554a72f1-6a10-4aca-9027-1642b4a66ab4",
            "service_account_id": "svac_01JEdFDBYcdR49gw6cf14hwh",
            "workspace_id": "wrkspc_011YNxhjEtK5CWK2AmBBQ7hq"
          }
          JSON
